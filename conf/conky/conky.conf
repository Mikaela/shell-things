-- Configuration settings: https://conky.cc/config_settings
conky.config = {
	alignment = 'top_left',
	background = true,
	border_width = 1,
	cpu_avg_samples = 2,
	default_color = '#dedede',
	default_outline_color = '#dedede',
	default_shade_color = '#dedede',
	double_buffer = true,
	draw_borders = true,
	draw_graph_borders = true,
	draw_outline = false,
	draw_shades = false,
	extra_newline = false,
	font = 'Atkinson Hyperlegible Mono:size=12',
	gap_x = 6,
	gap_y = 28,
	minimum_height = 5,
	minimum_width = 5,
	net_avg_samples = 2,
	no_buffers = true,
	out_to_console = false,
	out_to_ncurses = false,
	out_to_stderr = false,
	out_to_wayland = true,
	out_to_x = false,
	own_window = true,
	own_window_class = 'Conky',
	own_window_type = 'desktop',
	own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
	show_graph_range = false,
	show_graph_scale = false,
	stippled_borders = 0,
	update_interval = 10.0,
	uppercase = false,
	use_spacer = 'none',
	use_xft = true,
}

-- Variables: https://conky.cc/variables
conky.text = [[
$nodename - $sysname $kernel on $machine
$hr
${color grey}Uptime:$color $uptime
${color grey}RAM Usage:$color $mem/$memmax - $memperc% ${membar 4}
${color grey}Swap Usage:$color $swap/$swapmax - $swapperc% ${swapbar 4}
${color grey}CPU Usage:$color $cpu% ${cpubar 4}
${color grey}Processes:$color $processes  ${color grey}Running:$color $running_processes
$hr
${color grey}File systems:
/ $color${fs_used /}/${fs_size /} ${fs_bar 6 /}
${color grey}/home $color${fs_used /home}/${fs_size /home} ${fs_bar 6 /home}
${color grey}Networking:
eth0 Up:$color ${upspeed eth0} ${color grey} - Down:$color ${downspeed eth0}
${color grey}wlan0 Up:$color ${upspeed wlan0} ${color grey} - Down:$color ${downspeed wlan0}
${color grey}yggdrasil Up:$color ${upspeed yggdrasil} ${color grey} - Down:$color ${downspeed yggdrasil}
$hr
${color lightgrey} ${top name 1} ${top pid 1} ${top cpu 1} % ${top mem 1}  %
${color lightgrey} ${top name 2} ${top pid 2} ${top cpu 2} % ${top mem 2}  %
${color lightgrey} ${top name 3} ${top pid 3} ${top cpu 3} % ${top mem 3}  %
${color lightgrey} ${top name 4} ${top pid 4} ${top cpu 4} % ${top mem 4}  %
${color lightgrey} ${top name 5} ${top pid 5} ${top cpu 5} % ${top mem 5}  %
${color lightgrey} ${top name 6} ${top pid 6} ${top cpu 6} % ${top mem 6}  %
${color lightgrey} ${top name 7} ${top pid 7} ${top cpu 7} % ${top mem 7}  %
${color lightgrey} ${top name 8} ${top pid 8} ${top cpu 8} % ${top mem 8}  %
${color lightgrey} ${top name 9} ${top pid 9} ${top cpu 9} % ${top mem 9}  %
${color lightgrey} ${top name 10} ${top pid 10} ${top cpu 10} % ${top mem 10}  %
$hr
${color grey}Sensors${color}
${execpi 60 sensors|grep °|grep -v "0.0"}
${execpi 60 sensors|grep fan}
]]
