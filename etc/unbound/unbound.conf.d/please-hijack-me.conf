# These domains belong to silly network appliances or captive portals that
# wish to perform DNS hijacking instead of just using IP addresses.
# The server is mostly Quad9 default, but more may be used in case of
# important services for graceful fallback.
# IPv6 is specified when I have faith in domains/devices supporting it.
server:
# Quad9 says pointless performance impact on forwarders.
# https://docs.quad9.net/Quad9_For_Organizations/DNS_Forwarder_Best_Practices/#disable-qname-minimization
qname-minimisation: no

forward-zone:
	name: "router.asus.com"
	forward-tls-upstream: no
	forward-addr: 149.112.112.112
	forward-addr: 9.9.9.9

forward-zone:
	name: "tplinkrepeater.net"
	forward-tls-upstream: no
	forward-addr: 149.112.112.112
	forward-addr: 9.9.9.9

# Netgear
forward-zone:
	name: "mywifiext.net"
	forward-tls-upstream: no
	forward-addr: 149.112.112.112
	forward-addr: 9.9.9.9

forward-zone:
	name: "norwegianwifi.com"
	forward-tls-upstream: no
	forward-addr: 149.112.112.112
	forward-addr: 9.9.9.9

# https://fedoraproject.org/static/hotspot.txt via /lib/NetworkManager/conf.d/20-connectivity-fedora.conf
forward-zone:
	name: "fedoraproject.org"
	forward-tls-upstream: no
	# Quad9 ECS since this may host repositories
	forward-addr: 2620:fe::fe:11
	forward-addr: 9.9.9.11
	forward-addr: 2620:fe::11
	forward-addr: 149.112.112.11
	# Google DNS (since ECS)
	forward-addr: 2001:4860:4860::8844
	forward-addr: 2001:4860:4860::8888
	forward-addr: 8.8.4.4
	forward-addr: 8.8.8.8

# http://firefox-portal-detection.com/generate_204 from about:config captivedetect.canonicalURL
forward-zone:
	name: "firefox-portal-detection.com"
	forward-tls-upstream: no
	forward-addr: 2620:fe::fe
	forward-addr: 2620:fe::9
	forward-addr: 149.112.112.112
	forward-addr: 9.9.9.9
	# DNS4EU Protective
	forward-addr: 2a13:1001::86:54:11:201
	forward-addr: 2a13:1001::86:54:11:1
	forward-addr: 86.54.11.201
	forward-addr: 86.54.11.1

# vim: filetype=unbound.conf
